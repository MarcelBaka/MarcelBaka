name: Profile metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/metrics.yml"
      - ".github/scripts/steam_recent.py"

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      WAKATIME_TOKEN: ${{ secrets.WAKATIME_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: ${{ secrets.STEAM_ID }}
        run: |
          test -n "$METRICS_TOKEN" || { echo "::error::Add the METRICS_TOKEN repository secret"; exit 1; }
          test -n "$STEAM_API_KEY" || { echo "::error::Add the STEAM_API_KEY repository secret"; exit 1; }
          test -n "$STEAM_ID" || { echo "::error::Add the STEAM_ID repository secret"; exit 1; }

      - name: GitHub profile overview
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.base.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          base: header, activity, community, repositories
          config_timezone: Europe/Warsaw
          plugins_errors_fatal: yes

      - name: Isometric commit calendar
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          base: ""
          config_timezone: Europe/Warsaw
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugins_errors_fatal: yes

      - name: Languages activity
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          base: ""
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 6
          plugins_errors_fatal: yes

      - name: Repositories traffic
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.traffic.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          base: repositories
          plugin_traffic: yes
          plugins_errors_fatal: yes

      - name: Detailed Steam profile and games
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: ${{ secrets.STEAM_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/steam_recent.py

      - name: WakaTime coding activity
        if: env.WAKATIME_TOKEN != ''
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.wakatime.svg
          token: NOT_NEEDED
          base: ""
          plugin_wakatime: yes
          plugin_wakatime_token: ${{ secrets.WAKATIME_TOKEN }}
          plugin_wakatime_days: 7
          plugin_wakatime_sections: time, projects, projects-graphs, languages, languages-graphs, editors, os
          plugin_wakatime_limit: 5
          plugins_errors_fatal: yes
